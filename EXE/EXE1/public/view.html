<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
        }
        .navbar-custom a {
            text-decoration: none;
            margin: 0 10px;
            color: black;
        }
        .container-custom {
            width: 400px;
            padding: 20px;
            border: 1px solid black;
            background: white;
        }
        .info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }
        .info-row label {
            font-weight: bold;
            width: 100px; /* Độ rộng cố định cho label */
        }
        .info-row span {
            flex-grow: 1; /* Giúp giá trị căn đều */
            text-align: left;
        }
        .footer {
            text-align: center;
            border: 1px solid black;
            padding: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body class="d-flex flex-column align-items-center bg-light vh-100">

    <!-- Thanh Navbar trên -->
    <div class="navbar-custom w-75">
        <a href="index.html">Home</a> | 
        <a href="logout.html">Đăng xuất</a>
    </div>

    <!-- Chi tiết người dùng -->
    <div class="container-custom mt-3">
        <h4 class="text-center">Màn hình chi tiết</h4>
        <div class="info-row">
            <label>Username</label>
            <span>test1</span>
        </div>
        <div class="info-row">
            <label>Email</label>
            <span>test1@gmail.com</span>
        </div>
        <div class="text-end mt-3">
            <button class="btn btn-primary">Chỉnh sửa</button>
        </div>
    </div>

    <!-- Thanh Navbar dưới -->
    <div class="footer w-75">
        <span>Lập trình web @01/2024</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
